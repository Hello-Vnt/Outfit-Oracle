name = "outfitoracle-style"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated list of site origins allowed to call POST /style (no trailing slash).
# Replace with your live domain(s); keep localhost only while developing.
ALLOWED_ORIGINS = "https://www.outfitoracle.site,https://outfitoracle.site,https://hello-vnt.github.io,http://localhost:4578"
# Claude model that styles the look. claude-haiku-5-5 is the cheapest option.
MODEL = "claude-opus-5-5"

# The API key is a secret, never a var:
#   npx wrangler secret put ANTHROPIC_API_KEY

# Optional: a KV namespace makes the 20 requests / IP / hour limit hold across
# Worker instances (without it the count is kept in memory per instance).
#   npx wrangler kv namespace create RATE_KV
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<namespace id>"
